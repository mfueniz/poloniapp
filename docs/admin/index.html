<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Poloniapp admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="login-view" class="login-box">
    <h1>Poloniapp — admin</h1>
    <p class="login-note" id="setup-note" hidden>Primera vez: todavía no hay administradores. Elegí el email y la contraseña (mín. 8 caracteres) de la primera cuenta; se crean también las tablas de la base de datos con el contenido inicial.</p>
    <label for="email">Email</label>
    <input id="email" type="text" autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="login-btn">Ingresar</button>
    <p class="login-error" id="login-error" hidden></p>
  </div>

  <div id="admin-view" class="admin-shell" hidden>
    <header class="admin-header">
      <h1>Poloniapp — admin</h1>
      <div>
        <span class="who" id="who"></span>
        · <button class="btn-link" id="logout-btn">salir</button>
      </div>
    </header>

    <nav class="admin-tabs">
      <button data-tab="contenido" class="active">Contenido fijo</button>
      <button data-tab="categorias">Categorías</button>
      <button data-tab="actividades">Actividades</button>
      <button data-tab="ubicaciones">Ubicaciones</button>
      <button data-tab="publicaciones">Publicaciones</button>
      <button data-tab="textodiario">Texto diario</button>
      <button data-tab="inscripciones">Inscripciones</button>
      <button data-tab="admins">Administradores</button>
    </nav>

    <main id="tab-content">
      <p class="loading-note">Cargando…</p>
    </main>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>

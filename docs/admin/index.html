<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Poloniapp admin</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/fonts.css?v=20261027">
  <link rel="stylesheet" href="admin.css?v=20261027">
</head>
<body>
  <div id="login-view" class="login-box">
    <img class="login-logo" src="../assets/img/poloniapp-logo.svg" alt="Poloniapp">
    <h1>Panel de administración</h1>
    <p class="login-note" id="setup-note" hidden>Primera vez: todavía no hay administradores. Elige el email y la contraseña (mín. 8 caracteres) de la primera cuenta; se crean también las tablas de la base de datos con el contenido inicial.</p>
    <label for="email">Email</label>
    <input id="email" type="text" autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="login-btn">Ingresar</button>
    <p class="login-error" id="login-error" hidden></p>
  </div>

  <div id="admin-view" class="admin-shell" hidden>
    <header class="admin-header">
      <h1><img src="../assets/img/poloniapp-logo.svg" alt="Poloniapp"> <span>admin</span></h1>
      <div>
        <span class="who" id="who"></span>
        · <button class="btn-link" id="logout-btn">salir</button>
      </div>
    </header>

    <nav class="admin-tabs">
      <button data-tab="contenido" class="active">Contenido fijo</button>
      <button data-tab="actividades">Actividades</button>
      <button data-tab="proyectos">Proyectos</button>
      <button data-tab="rezar">Para rezar hoy</button>
      <button data-tab="admins">Administradores</button>
    </nav>

    <main id="tab-content">
      <p class="loading-note">Cargando…</p>
    </main>
  </div>

  <script type="module" src="admin.js?v=20261027"></script>
</body>
</html>

# Cada madrugada (hora de Chile) pide "Para rezar hoy" a la API del sitio, para que el servidor
# lea los títulos del día de opusdei.org antes de que llegue la primera visita.
# Si nadie lo dispara, igual se actualiza solo con la primera visita del día.
name: Para rezar hoy

on:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC = 01:17 en Chile (horario de verano) / 00:17 (invierno)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://poloniapp.cl' }}
        run: curl -fsS --max-time 60 "$SITE_URL/api/?action=prayer"

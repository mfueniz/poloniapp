# Despliega docs/ al hosting de Spaceship por FTP cada vez que se actualiza main.
# Requiere en Settings → Secrets and variables → Actions:
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#              DB_NAME, DB_USER, DB_PASS (base MySQL creada en cPanel; DB_HOST opcional, por defecto localhost)
#   Variables (opcionales): FTP_SERVER_DIR (por defecto public_html/), FTP_PROTOCOL (por defecto ftps),
#                           FTP_SECURITY (por defecto strict; loose acepta un certificado que no calza,
#                           p. ej. al conectar por IP)
name: Deploy a Spaceship

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-spaceship.yml'
      - '.github/htaccess-poloniapp'
  workflow_dispatch:

concurrency:
  group: deploy-spaceship
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credenciales
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::Faltan los secrets FTP_* — se omite el despliegue."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      # Credenciales de MySQL para la API (docs/api/). Nunca están en el repo: se escriben acá
      # desde los secrets. Si faltan, se corta el deploy, porque subir sin config.php haría que
      # el deploy borrara el del servidor y el sitio quedaría sin base de datos.
      - name: Generar docs/api/config.php
        if: steps.check.outputs.ready == 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          if [ -z "$DB_NAME" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASS" ]; then
            echo "::error::Faltan los secrets DB_NAME, DB_USER y/o DB_PASS."
            exit 1
          fi
          php -r 'echo "<?php\nreturn ", var_export([
            "db_host" => getenv("DB_HOST") ?: "localhost",
            "db_name" => getenv("DB_NAME"),
            "db_user" => getenv("DB_USER"),
            "db_pass" => getenv("DB_PASS"),
          ], true), ";\n";' > docs/api/config.php
          php -l docs/api/config.php

      # Direcciones limpias (/actividad/…): el .htaccess de la carpeta del sitio necesita las
      # reglas de .github/htaccess-poloniapp. cPanel puede tener ahí su propio .htaccess (ej. la
      # versión de PHP), así que se descarga el actual y solo se reemplaza el bloque de Poloniapp.
      # Si no se puede leer (por algo distinto a "no existe"), se corta para no pisarlo.
      - name: Preparar docs/.htaccess (conserva lo que ya tenga el servidor)
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_SECURITY: ${{ vars.FTP_SECURITY || 'strict' }}
        run: |
          dir="${FTP_SERVER_DIR%/}/"
          [ "$dir" = "./" ] && dir=""
          opts=(--silent --show-error --max-time 60 --user "$FTP_USERNAME:$FTP_PASSWORD")
          [ "$FTP_PROTOCOL" = "ftp" ] || opts+=(--ssl-reqd)
          [ "$FTP_SECURITY" = "loose" ] && opts+=(--insecure)
          set +e
          curl "${opts[@]}" "ftp://$FTP_SERVER/${dir}.htaccess" -o server.htaccess
          code=$?
          set -e
          if [ "$code" -eq 78 ]; then
            : > server.htaccess
            echo "No había .htaccess en el servidor: se crea uno nuevo."
          elif [ "$code" -ne 0 ]; then
            echo "::error::No se pudo leer el .htaccess del servidor (curl $code). No se sigue para no pisarlo."
            exit 1
          else
            echo "Se conserva el .htaccess del servidor ($(grep -vc '^# \(BEGIN\|END\) Poloniapp' server.htaccess) líneas)."
          fi
          awk '/^# BEGIN Poloniapp/{skip=1} !skip{print} /^# END Poloniapp/{skip=0}' server.htaccess | sed '/./,$!d' > rest.htaccess
          { cat .github/htaccess-poloniapp; [ -s rest.htaccess ] && { echo; cat rest.htaccess; }; } > docs/.htaccess
          rm -f server.htaccess rest.htaccess
          echo "docs/.htaccess listo ($(wc -l < docs/.htaccess) líneas)."

      - name: Subir docs/ por FTP
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./docs/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          security: ${{ vars.FTP_SECURITY || 'strict' }}

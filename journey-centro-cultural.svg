<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Journey futuro de una persona curiosa sobre el centro cultural</title>
<desc>Cuatro etapas verticales: trigger social, aterrizaje en el centro, autoinformación en dos capas, y contacto simple vía WhatsApp.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="190" y="20" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Trigger social</text>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">amigo lo menciona, cercanía física</text>
<line x1="340" y1="76" x2="340" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="120" width="380" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Aterrizaje: el punto que hoy no existe</text>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">un lugar propio del centro para consultar</text>
<line x1="340" y1="176" x2="340" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="130" y="220" width="180" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="220" y="242" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Identidad</text>
<text x="220" y="262" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">qué es, su lugar</text>
<text x="220" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">en el O.</text>

<rect x="370" y="220" width="180" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="460" y="242" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Actividades</text>
<text x="460" y="262" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">meditaciones, retiros,</text>
<text x="460" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">doctrina, formación</text>

<line x1="220" y1="290" x2="220" y2="310" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
<line x1="460" y1="290" x2="460" y2="310" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
<line x1="220" y1="310" x2="460" y2="310" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
<line x1="340" y1="310" x2="340" y2="340" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="170" y="340" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="358" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Contacto simple</text>
<text x="340" y="376" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">bubble chat directo a grupo de WhatsApp</text>
</svg>
